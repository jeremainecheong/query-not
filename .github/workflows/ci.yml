# Full verification: unit tests, then both end-to-end suites against a real
# Postgres with hypopg and pg_stat_statements — the same stack the agent talks
# to in production. A suite that only ran against fixtures would not have caught
# most of the bugs this project has already found.
#
# Postgres is installed on the runner rather than used as a service container,
# because the agent needs two extensions and a read-only role. No published
# image carries both, and the read-only role is not optional: the E2E asserts
# the agent connects as a role that cannot write, which a superuser fails.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR branch triggers push and pull_request both; without this the same commit
# is verified twice in parallel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04

    env:
      # The agent connects as a role that cannot write — layer 4 of the safety
      # design, and asserted by the API suite.
      QUERYNOT_DATABASE_URL: postgres://querynot_ro:querynot@127.0.0.1:5432/querynot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL with hypopg and pg_stat_statements
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-contrib-16 postgresql-16-hypopg

          # The runner image may already have a cluster listening; make sure the
          # one we configure is the one on 5432.
          sudo pg_ctlcluster 16 main start || sudo pg_ctlcluster 16 main restart

          # pg_stat_statements only collects when preloaded, which needs a restart.
          sudo -u postgres psql -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          sudo pg_ctlcluster 16 main restart

      - name: Create the database, extensions and read-only role
        run: |
          set -euxo pipefail
          sudo -u postgres createdb querynot
          sudo -u postgres psql -d querynot -c 'CREATE EXTENSION IF NOT EXISTS hypopg'
          sudo -u postgres psql -d querynot -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
          sudo -u postgres psql -d querynot -f packages/core/test/fixtures/seed.sql

          sudo -u postgres psql -c "CREATE ROLE querynot_ro LOGIN PASSWORD 'querynot'"
          sudo -u postgres psql -c 'GRANT CONNECT ON DATABASE querynot TO querynot_ro'
          sudo -u postgres psql -d querynot -c 'GRANT USAGE ON SCHEMA public TO querynot_ro'
          sudo -u postgres psql -d querynot -c 'GRANT SELECT ON ALL TABLES IN SCHEMA public TO querynot_ro'

      - run: npm ci

      # Core builds first: the agent typechecks and the tests both resolve
      # @query-not/core through its build output.
      - run: npm run build --workspace @query-not/core
      - run: npm run typecheck
      - run: npm test

      - name: Install a browser for the UI suite
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npm run test:e2e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-log
          path: /var/log/postgresql/
          if-no-files-found: ignore
